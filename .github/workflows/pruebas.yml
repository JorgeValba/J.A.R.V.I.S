# Pruebas automáticas en modo simulación: no usan llaves ni gastan cuota.
# Se ejecutan cada vez que subes cambios; si algo se rompe, verás una ❌ en la pestaña Actions.
name: pruebas

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODO_SIMULACION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python analizar.py AAPL --simulacion

  validar-gratis:
    if: contains(github.event.head_commit.message, '[validar-gratis]')
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mesa-financiera
      cancel-in-progress: false
    env:
      OPENIA_API_KEY: ${{ secrets.OPENIA_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODELO: gpt-5.1
      MODO_SIMULACION: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verificar secretos sin imprimirlos
        run: |
          python -c "import os; assert all(os.getenv(k) for k in ('OPENIA_API_KEY','ALPHAVANTAGE_API_KEY','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID')), 'Faltan secretos para validar'"
      - name: Prueba real gratuita y Telegram
        run: python analizar.py AAPL --telegram
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validacion-gratuita-Jorge-Valencia
          path: salidas/
          retention-days: 14
