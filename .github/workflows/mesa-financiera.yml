# Mesa Financiera en la nube: funciona con tu computadora apagada.
#  · Los lunes a las 09:00, Ciudad de México, revisa si escribiste /analiza TICKER en Telegram y responde.
#  · También puedes lanzarlo a mano (incluso desde la app de GitHub en tu celular):
#    Actions → mesa-financiera → Run workflow → escribe el ticker.
name: mesa-financiera

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar (déjalo vacío para solo revisar Telegram)"
        required: false
        default: "AAPL"
      simulacion:
        description: "Modo simulación (sin gastar llaves)"
        type: boolean
        default: false

concurrency:                        # evita dos ejecuciones al mismo tiempo
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENIA_API_KEY: ${{ secrets.OPENIA_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MODO_SIMULACION: ${{ inputs.simulacion && '1' || '0' }}
      MODELO: "gpt-5.1"
      TICKER: ${{ inputs.ticker }}  # se pasa como variable, nunca se pega dentro del comando
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analizar el ticker indicado a mano
        if: github.event_name == 'workflow_dispatch' && env.TICKER != ''
        run: python analizar.py "$TICKER" --telegram

      - name: Revisar mensajes pendientes en Telegram
        run: python revisar_telegram.py

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 14
